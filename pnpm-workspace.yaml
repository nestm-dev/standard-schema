packages:
  - '.'
  - 'examples/*'

overrides:
  multer: '2.2.0'

# @nestjs/core's postinstall is only a donation banner; never run it.
allowBuilds:
  '@nestjs/core': false
  '@scarf/scarf': false

# `changeset publish` shells out to `pnpm publish`, and pnpm ignores
# package.json's publishConfig.provenance. Setting it here makes a failed
# attestation a hard publish error instead of silently skipping provenance.
provenance: true

minimumReleaseAgeExclude:
  - '@inquirer/checkbox@5.2.3'
  - '@inquirer/confirm@6.3.0'
  - '@inquirer/core@12.0.1'
  - '@inquirer/editor@5.3.1'
  - '@inquirer/expand@5.1.3'
  - '@inquirer/input@5.1.4'
  - '@inquirer/number@4.2.1'
  - '@inquirer/password@5.2.0'
  - '@inquirer/prompts@8.7.0'
  - '@inquirer/rawlist@5.3.3'
  - '@inquirer/search@4.3.1'
  - '@inquirer/select@5.2.3'
  - '@inquirer/type@4.1.0'
  - '@nestjs/cli@12.0.0'
  - '@nestjs/common@12.0.1'
  - '@nestjs/core@12.0.1'
  - '@nestjs/mapped-types@12.0.0'
  - '@nestjs/platform-express@12.0.1'
  - '@nestjs/platform-fastify@12.0.1'
  - '@nestjs/schematics@12.0.0'
  - '@nestjs/swagger@12.0.0'
  - '@nestjs/testing@12.0.1'
  - '@types/node@26.4.0'
