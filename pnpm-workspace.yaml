packages:
  - '.'
  - 'examples/*'

# Nest 12.0.0-alpha.* still declares ^11.0.0 peers on its own siblings.
peerDependencyRules:
  allowedVersions:
    '@nestjs/common': '12'
    '@nestjs/core': '12'
    '@nestjs/platform-express': '12'

overrides:
  multer: '2.2.0'

# @nestjs/core's postinstall is only a donation banner; never run it.
allowBuilds:
  '@nestjs/core': false

# `changeset publish` shells out to `pnpm publish`, and pnpm ignores
# package.json's publishConfig.provenance. Setting it here makes a failed
# attestation a hard publish error instead of silently skipping provenance.
provenance: true
