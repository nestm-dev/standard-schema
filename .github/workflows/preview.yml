name: Preview release

# Dormant until the pkg.pr.new GitHub app is installed on nestm-dev; then
# restore `push: { branches: [main] }` + `pull_request:` triggers.
on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm dlx pkg-pr-new@0.0.87 publish
